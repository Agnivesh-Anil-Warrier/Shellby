name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Enforce least-privilege permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linux Suite (Syntax, Ruff, Gitleaks, PTY, Unit Tests & Smoke Test)
  # ----------------------------------------------------------------------------
  test-linux:
    name: Linux Suite (Python 3.12)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: Linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Linux/requirements.txt

      - name: Python Syntax Compilation Verification
        run: |
          python -m compileall Linux Windows

      - name: Ruff Critical Error Checks
        run: |
          pip install ruff
          ruff check Linux Windows --select=E9,F63,F7,F82

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux Headless Graphics & Qt Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libxrender1 \
            libxcb-xinerama0 \
            xvfb

      - name: Install Linux Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r Linux/requirements.txt

      - name: Execute Linux Tests under Xvfb
        run: |
          xvfb-run -a pytest Linux/tests/ -v --tb=short

      - name: End-to-End PTY Recording Integration Test
        run: |
          python Linux/test_recording_smoke.py

  # ----------------------------------------------------------------------------
  # Job 2: Windows Suite (Unit Tests, Console Recording, Launcher, Packaging)
  # ----------------------------------------------------------------------------
  test-windows:
    name: Windows Suite (Python 3.12)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: "Windows;."
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Windows/requirements.txt

      - name: Install Windows Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r Windows/requirements.txt

      - name: Execute Windows Test Suite
        run: |
          pytest Windows/test_windows.py -v --tb=short

      - name: End-to-End Console Recording Integration Test
        shell: pwsh
        run: |
          python Windows/test_recording_smoke.py

      - name: Verify Batch Launcher Syntax & Help Banner
        shell: pwsh
        run: |
          $output = cmd.exe /c "Windows\run_shellby.bat --help" 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "run_shellby.bat --help failed with exit code $exitCode"
          }
          $text = $output -join "`n"
          if ($text -notmatch "Shellby for Windows Command Prompt") {
            throw "run_shellby.bat output missing expected banner: $text"
          }
          Write-Host "Batch launcher syntax and output banner verified successfully."

      - name: Build Standalone Executable (PyInstaller)
        working-directory: Windows
        run: |
          pip install pyinstaller
          pyinstaller Shellby.spec --log-level WARN --clean --noconfirm

      - name: Smoke-Test Packaged Executable
        working-directory: Windows
        shell: pwsh
        run: |
          $exe = ".\dist\Shellby\Shellby.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }
          $output = & $exe --help 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Packaged executable help command failed with exit code $exitCode"
          }
          $text = $output -join "`n"
          if ($text -notmatch "Shellby") {
            throw "Packaged executable output did not contain expected banner: $text"
          }
          Write-Host "Packaged executable smoke test passed successfully."
